name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  branch-policy:
    name: Branch policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require a development branch
        shell: pwsh
        env:
          DEVELOPMENT_BRANCH: ${{ github.head_ref }}
        run: ./scripts/Test-DevelopmentBranch.ps1 -BranchName $env:DEVELOPMENT_BRANCH

  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify PowerShell 7.4+ module import
        run: |
          $minimumVersion = [version]'7.4.0'
          Write-Output "PowerShell runtime: $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSVersion -lt $minimumVersion) {
              throw "PowerShell $minimumVersion or later is required."
          }
          Import-Module ./ApimAssessment.psd1 -Force -ErrorAction Stop
      - name: Install pinned development tools and public Bicep modules
        run: ./scripts/Install-DevDependencies.ps1
      - name: Lint and run offline tests
        run: ./scripts/Invoke-Checks.ps1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/TestResults.xml
          if-no-files-found: ignore
